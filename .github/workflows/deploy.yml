name: Deploy site (main)

# Publishing only. Pre-merge checks live in verify.yml (pull_request). Same paths
# list as that file — Actions does not support YAML anchors, so it is duplicated;
# when you edit one, edit the other.
on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "site/**"
      - "scripts/**"
      - "tests/**"
      # The audit asserts these paths are ignored, so a change here can flip it.
      - ".gitignore"
      # Editing either half of the gate must re-run the checks.
      - ".github/workflows/verify.yml"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  # The last machine gate before publishing. Since phase-15 the repo is public, so a
  # ruleset on main can and does require the PR-side verify/lint checks — but a repo
  # admin can bypass a ruleset, and this job is what still runs on the commit that is
  # actually about to be published. It needs no Node and no build, so it costs almost
  # nothing. (Before phase-15 the reason was different: rulesets returned 403
  # "Upgrade to GitHub Pro or make this repository public" on a private free-plan repo,
  # so this job was the ONLY machine gate.)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint wiki content
        run: python3 scripts/lint_wiki.py

      - name: Run lint fixture tests
        run: python3 scripts/test_lint_wiki.py

  deploy:
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Serializes deploys against each other; distinct from the lint gate above.
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # build.py exits 1 on a broken internal link, so link integrity gates the
      # deploy here even though test_build_site.py runs only on pull requests.
      - name: Build site
        run: |
          pip install -r site/requirements.txt
          python3 site/build.py
          npx -y pagefind@1 --site site/dist

      # Audits the exact tree about to be uploaded to a public bucket, on this
      # runner — not the different dist/ the pull-request run built. The raw/
      # boundary is non-negotiable.
      - name: Verify gate (raw/ leak audit — fail = no deploy)
        run: python3 scripts/verify_site.py

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # The split is by "does the filename carry a content hash", not by file type.
      # Pagefind mixes both: fragment/, index/ and *.pf_meta are hashed, but
      # pagefind.js, pagefind-entry.json, pagefind-ui.* and wasm.unknown.pagefind
      # keep fixed names while their content changes every rebuild. A whitelist
      # means a new fixed-name file lands in the safe group by default.
      - name: Sync long-cache assets (content-hashed filenames)
        run: |
          aws s3 sync site/dist "s3://${{ secrets.SITE_BUCKET }}" \
            --delete \
            --exclude "*" \
            --include "pagefind/fragment/*" \
            --include "pagefind/index/*" \
            --include "pagefind/*.pf_meta" \
            --cache-control "public,max-age=31536000,immutable"

      # Exact complement of the filters above, so every object is covered by
      # exactly one --delete pass.
      - name: Sync short-cache assets (fixed filenames, mutable content)
        run: |
          aws s3 sync site/dist "s3://${{ secrets.SITE_BUCKET }}" \
            --delete \
            --exclude "pagefind/fragment/*" \
            --exclude "pagefind/index/*" \
            --exclude "pagefind/*.pf_meta" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
