name: Verify site

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "site/**"
      - "site-test/**"
      - "scripts/**"
      # The audit asserts these paths are ignored, so a change here can flip it.
      - ".gitignore"
      # Editing the gate must re-run the gate.
      - ".github/workflows/verify-site.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # Both sites' results are wanted on every run; a failure in one must not
      # cancel the other and hide whether it would have passed.
      fail-fast: false
      matrix:
        site: [site, site-test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3"

      - name: Install site dependencies
        working-directory: ${{ matrix.site }}
        run: npm ci

      - name: Build site
        working-directory: ${{ matrix.site }}
        run: |
          npx quartz plugin install --from-config
          npx quartz build

      - name: Run raw/ boundary audit
        run: python3 scripts/verify_site.py ${{ matrix.site }}

  # Content-quality gate. Independent of the sites, so it neither waits on the
  # matrix nor reruns per site.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3"

      - name: Lint wiki content
        run: python3 scripts/lint_wiki.py
